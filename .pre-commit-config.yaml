repos:

  # General checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [ '--maxkb=512' ]
      - id: check-ast
      - id: check-case-conflict
      - id: check-json
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
        args:
         - --unsafe
        exclude: "^deployment/helm/.*"
      - id: check-xml
      - id: debug-statements
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [ --fix=lf ]
      - id: name-tests-test
      - id: trailing-whitespace

  # Checking dependencies
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.9.12
    hooks:
      - id: uv-lock

  # Ruff checks & formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # ruff version.
    rev: v0.14.6
    hooks:
      - id: ruff-check
        args: [ --fix ]
        types_or: [ python, pyi ]
      - id: ruff-format
        types_or: [ python, pyi ]

  # Mypy static type checking
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: bash -c 'mypy ./src --config-file mypy.ini'
        language: system
        types: [ python ]
        require_serial: true
        pass_filenames: false
