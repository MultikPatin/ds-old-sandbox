[project]
name = "ds-storage"
version = "0.2.0"
description = "Service for creating and storing documents based on layouts"
requires-python = ">=3.12"
dependencies = [
    # Core
    "dishka==1.7.*",
    "pydantic-settings==2.12.*",
    # API
    "fastapi==0.122.*",
    "uvicorn==0.38.*",
    "orjson==3.11.*",
    # MongoDB
    "beanie==2.0.*",
    "python-snappy==0.7.*",
]

[dependency-groups]
dev = [
    "pre-commit==4.5.*",
    # Static type checking
    "mypy==1.19.*",
    # Checks & formatting
    "ruff==0.14.*",
]

[[tool.uv.index]]
name = "abgroup"
url = "https://nexus.abgroup.tech/repository/abgroup-pypi-group/simple"
