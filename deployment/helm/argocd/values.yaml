argocd:
  name: ds-storage
  namespace: ds-storage-dev
  sources:
    chart:
      url: https://nexus.abgroup.tech/repository/abgroup-helm
      name: nxs-universal-chart
      targetRevision: 2.8.2
    main:
      url: https://gitlab.abgroup.tech/main/openform/document-service/ds-storage.git
      targetRevision: dev
      valuePath: deployment/helm/argocd/values.yaml
    env:
      url: https://gitlab.abgroup.tech/main/infrastructure/abgroup-k3s-test.git
      targetRevision: main
      valuePath: product-services/abgroup/openform/ds-storage/helm/values.yaml
      commonValuesPath: product-services/common/common.yaml

generic:
  extraImagePullSecrets:
    - name: harbor-auth-secret

services:
  api:
    extraSelectorLabels:
      app: api
    ports:
      - name: http
        protocol: TCP
        port: 80
        targetPort: 8000
  constructor-api:
    extraSelectorLabels:
      app: constructor-api
    ports:
      - name: http
        protocol: TCP
        port: 80
        targetPort: 8000

deployments:
  api:
    extraSelectorLabels:
      app: api
    containers:
      api:
        name: api
        command: [ "entrypoint-storage-api.sh" ]
        resources:
          requests:
            memory: "256Mi"
            cpu: "500m"
          limits:
            cpu: "1"
            memory: "1Gi"
        envsFromConfigmap:
          envs:
            - MONGODB_HOST
            - MONGODB_PORT
            - MONGODB_DATABASE
            - MONGODB_USERNAME
            - STORAGE_IS_DEV_MODE
            - STORAGE_API_V3_TITLE
            - STORAGE_API_V3_DESCRIPTION
            - STORAGE_API_V3_MAJOR_VERSION
            - CONSTRUCTOR_IS_DEV_MODE
            - CONSTRUCTOR_API_V1_TITLE
            - CONSTRUCTOR_API_V1_DESCRIPTION
        envsFromSecret:
          secret:
            - MONGODB_PASSWORD: MONGODB_PASSWORD
  constructor-api:
    extraSelectorLabels:
      app: constructor-api
    containers:
      constructor-api:
        name: constructor-api
        command: [ "entrypoint-constructor-api.sh" ]
        resources:
          requests:
            memory: "256Mi"
            cpu: "500m"
          limits:
            cpu: "1"
            memory: "1Gi"
        envsFromConfigmap:
          envs:
            - MONGODB_HOST
            - MONGODB_PORT
            - MONGODB_DATABASE
            - MONGODB_USERNAME
            - STORAGE_IS_DEV_MODE
            - STORAGE_API_V3_TITLE
            - STORAGE_API_V3_DESCRIPTION
            - STORAGE_API_V3_MAJOR_VERSION
            - CONSTRUCTOR_IS_DEV_MODE
            - CONSTRUCTOR_API_V1_TITLE
            - CONSTRUCTOR_API_V1_DESCRIPTION
        envsFromSecret:
          secret:
            - MONGODB_PASSWORD: MONGODB_PASSWORD

