include:
  - project: 'main/template/common_gitlab_ci'
    ref: main
    file:
     - 'stage/release-backend.yml'
     - 'uv/uv-dir-verify.yml'
     - 'uv/ruff-check.yml'
     - 'uv/ruff-format.yml'
     - 'uv/mypy.yml'

stages:
  - prelint
  - lint
  - build
  - create-tag

variables:
  REGISTRY_IMAGE_DEV: ${REGISTRY}/ds-storage-dev/api
  REGISTRY_IMAGE_DEMO: ${REGISTRY}/ds-storage-demo/api
  REGISTRY_IMAGE_PROD: ${REGISTRY}/ds-storage/api
  UV_VERSION: "0.9.3"

build-dev:
  extends: .build
  script:
    - docker build --build-arg UV_VERSION="$UV_VERSION" -t $REGISTRY_IMAGE:$IMAGE_TAG -f $DOCKERFILE .
    - docker push $REGISTRY_IMAGE:$IMAGE_TAG
    - echo "IMAGE_NAME=$REGISTRY_IMAGE:$IMAGE_TAG" > imageinfo.env
